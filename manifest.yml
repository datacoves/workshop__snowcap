# manifest.yml
#
# Manifest for the Snowcap workshop, reimplemented with Snowflake DCM Projects.
# https://docs.snowflake.com/en/user-guide/dcm-projects/dcm-projects-overview
#
# The Snowflake connection is supplied on the command line by plan.sh /
# deploy.sh (driven by the values in your .env file), so there is a single
# source of truth for the account and no per-environment routing here.
#
# manifest_version 2 requires at least one entry under `targets`, and the CLI
# resolves that target before it looks at any identifier passed on the command
# line -- so this block cannot be omitted. A lone target is treated as the
# default, which is why no `default_target` key is needed. `project_name` is
# the only required field; `account_identifier` and `project_owner` are
# deliberately left out so this file stays portable across workshop accounts
# (the CLI only warns that it cannot cross-check them).
#
# All object definitions are auto-discovered from sources/definitions/*.sql.

manifest_version: 2
type: DCM_PROJECT

targets:
  workshop:
    project_name: dcm.projects.workshop
